<!DOCTYPE html>
<html>
<head>
    <title>Cobot Control Panel</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>

<body>
    <main class="page">
        <h1>Cobot Control Panel</h1>

        <div class="dashboard-grid">

            <section class="card config-card">
                <h2>Configuration</h2>

                <label for="robot_ip">Robot IP</label>
                <input id="robot_ip" type="text">

                <label for="camera_ip">Camera IP</label>
                <input id="camera_ip" type="text">

                <label for="save_folder">Save Folder</label>
                <input id="save_folder" type="text">

                <label for="confidence_threshold">Confidence Threshold</label>
                <input id="confidence_threshold" type="number" step="0.01">

                <label class="checkbox-row">
                    <input id="enable_motion" type="checkbox">
                    Enable Motion
                </label>

                <button type="button" onclick="saveConfig()">Save Config</button>
                <p id="save_status"></p>
            </section>

            <section class="card robot-card">
                <h2>Robot Commands</h2>

                <button type="button" onclick="sendRobotCommand('start_robot')" class="start">
                    Start
                </button>

                <button type="button" onclick="sendRobotCommand('calibrate_robot')" class="start">
                    Calibrate
                </button>

                <button type="button" onclick="sendRobotCommand('stop_robot')" class="danger">
                    Stop
                </button>

                <p id="robot_command_status"></p>
            </section>

            <section class="card image-card">
                <h2>Latest Vision Image</h2>
                <img id="latest_image" alt="Latest image">
            </section>

        </div>
    </main>

    <script src="/static/app.js?v=3"></script>
</body>
</html>
