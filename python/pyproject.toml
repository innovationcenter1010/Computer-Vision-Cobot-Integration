[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cobot_application"
version = "0.1.0"

dependencies = [
    "ultralytics",
    "opencv-python-headless",
    "numpy",
    "pyyaml"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cobot_application*"]
