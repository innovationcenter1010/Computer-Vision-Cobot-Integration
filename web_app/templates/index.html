<!DOCTYPE html>
<html>
<head>
    <title>Cobot Vision Interface</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Cobot Vision Interface</h1>

    <div class="section">
        <h2>Configuration</h2>

        <label>Robot IP</label>
        <input id="robot_ip">

        <label>Camera IP</label>
        <input id="camera_ip">

        <label>Save Folder</label>
        <input id="save_folder">

        <label>Confidence Threshold</label>
        <input id="confidence_threshold" type="number" step="0.01">

        <label>
            <input id="enable_motion" type="checkbox">
            Enable Motion
        </label>

        <button onclick="saveConfig()">Save Config</button>

        <p id="save_status"></p>
    </div>

    <div class="section">
        <h2>Latest Image</h2>
        <button onclick="loadLatestImage()">Refresh Image</button>
        <br><br>
        <img id="latest_image" src="" alt="No image found">
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
