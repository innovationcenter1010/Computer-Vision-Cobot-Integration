io:
  outputs:
    gripper:
      io_type: general_output
      group: 1
      bit: 2
  sensors:
    existance_check:
      io_type: general_input
      group: 1
      bit: 3
    divot_check:
      io_type: general_input
      group: 1
      bit: 4
    right_complete:
      io_type: general_input
      group: 1
      bit: 5
    left_complete:
      io_type: general_input
      group: 1
      bit: 6
# Added to every commanded MoveToPose rz before it reaches the robot: the
# physical toolhead is clocked 90 deg off the taught/commanded convention.
# Software-side correction only -- the YRC1000 tool files are untouched.
mount_yaw_offset_deg: 90.0
motion_profiles:
  default:
    interpolation: joint
    speed: 25.0
    accel_ratio: 25.0
    decel_ratio: 25.0
    accuracy_mm: 50
  descend:
    interpolation: linear
    speed: 100.0
    accel_ratio: 25.0
    decel_ratio: 25.0
    accuracy_mm: 0
tools:
  none:
    tool_number: 0
    tip_offset_mm:
    - 0.0
    - 70.0
    - 0.0
    marker_offset_mm:
    - 0.0
    - 0.0
    - 200.0
    compression_mm: 50.0
    pick_tip_z_mm: 220.0
    approach_tip_z_mm: 400.0
    descend_profile: descend
  vacuum_head:
    tool_number: 1
    marker_offset_mm:
    - 0.0
    - 0.0
    - 0.0
    compression_mm: 50.0
    pick_tip_z_mm: 300.0
    approach_tip_z_mm: 401.0
    descend_profile: descend
