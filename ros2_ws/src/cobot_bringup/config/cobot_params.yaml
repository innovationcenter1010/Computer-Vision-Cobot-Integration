# All runtime-tunable parameters for the bin-picking stack.
# Replaces the legacy config.JSON shared Config object (see
# docs/ros2_architecture.md §6). Values migrated from legacy/config.JSON.
#
# Structured data (place trajectories) lives in trajectories.json, referenced
# by cobot_node.trajectories_file — launch resolves it to the installed share
# path unless overridden. The fitted camera→robot transform lives in
# calibration.yaml next to this file (written by the calibration routine,
# injected as localization_node.calibration_file by launch).

camera_node:
  ros__parameters:
    color_endpoint: "tcp://host.docker.internal:5550"
    depth_endpoint: "tcp://host.docker.internal:5551"
    publish_rate_hz: 15.0
    # /camera/save_frames writes timestamped color/depth PNG pairs here
    # (bind-mounted → appears on the host under vision_workspace/).
    capture_dir: "/ws/vision_workspace/operation/captures"
    # Camera intrinsics JSON the streamer writes from its SDK; relayed as a
    # latched /camera/color/camera_info. Use the COLOR intrinsics and enable
    # depth->color alignment in the streamer so depth pixels match color.
    # Schema: {"fx":..,"fy":..,"cx":..,"cy":..,"width":640,"height":480}
    intrinsics_file: "/ws/vision_workspace/operation/camera_intrinsics.json"

yolo_node:
  ros__parameters:
    model_path: "/ws/vision_workspace/models/cans_obb_best.pt"
    confidence: 0.50
    iou: 0.4
    max_detections: 20
    image_size: 640
    remove_duplicates: true
    duplicate_center_distance_px: 50.0
    # Calibration marker model (/vision/locate_dot), lazy-loaded on first use.
    dot_model_path: "/ws/vision_workspace/models/red_dot_best.pt"
    dot_confidence: 0.5

localization_node:
  ros__parameters:
    # Pick order is a robot-frame snake (no bin corners — those go stale when
    # the bin shifts). Rows are grouped along this robot axis ("x" or "y");
    # the arm serpentines along the other axis within each row.
    pathing_row_axis: "y"
    pathing_row_tolerance_mm: 50.0
    can_height_mm: 87.0
    depth_buffer_size: 15
    depth_sample_window_px: 10
    verify_tolerance_mm: 40.0
    # Depth reading (mm) when the top layer is present. 0.0 = uncalibrated:
    # get_layer_height returns layer_index=-1 until measured on hardware.
    depth_at_top_layer_mm: 0.0
    # --- camera→robot calibration (math side) ---
    # Red dot relative to the OFFICIAL toolhead point (the commanded TCP),
    # [x, y, z] mm along ROBOT BASE axes with the arm at the calibration
    # orientation. Measure to the dot surface the camera sees. This is the
    # dot's half of the pair — the tooling's half is cobot_node.tool_offset_mm;
    # both hang off the same point, so measure them separately.
    # MEASURE AND SET BEFORE CALIBRATING.
    marker_offset_mm: [0.0, 0.0, 300.0]
    dot_samples_per_pose: 3
    calibration_min_samples: 6
    # Fit worse than this on any axis → calibration rejected, old transform kept.
    calibration_max_rms_mm: 5.0
    # Intrinsics come from the camera SDK (/camera/color/camera_info). True:
    # calibration is the small extrinsic-only (Kabsch) fit and refuses until
    # intrinsics arrive. False: allow the full monolithic fit (needs the wide
    # depth-span grid) when no intrinsics are available.
    require_intrinsics: true
    # TEMPORARY manual centre select: true = calibration_sample skips the
    # red-dot model and waits for you to click the marker centre on the web
    # UI's color feed. Everything downstream is identical. Keep
    # task_manager.calibration_sample_timeout_sec above the timeout here.
    manual_dot_selection: true
    manual_click_timeout_sec: 120.0
    # calibration_file is injected by robot.launch.py (bind-mounted config dir).

cobot_node:
  ros__parameters:
    robot_ip: "192.168.1.31"
    # --- offsets from the OFFICIAL toolhead point (the pose the controller
    # commands) --- two things hang off it and neither sits on it:
    #   * the end of the tooling  -> tool_offset_mm (here)
    #   * the red calibration dot -> localization_node.marker_offset_mm
    # Same origin, different features: MEASURE THEM SEPARATELY, both as
    # [x, y, z] mm along ROBOT BASE axes with the arm at rz=0 and the pick
    # orientation (rx=180, ry=0). XY rotates with the commanded rz; Z does not.
    #
    # Applied to vision-derived pick poses only. Teach points
    # (trajectories.json) and the calibration grid are already commanded-
    # toolhead poses and stay raw.
    #
    # NOTE: zeros = tip is the toolhead point = the behavior before this
    # param existed. Setting a non-zero Z also changes what the pick and
    # approach heights mean (they become TIP heights, PICK_TIP_Z_MM /
    # APPROACH_TIP_Z_MM in cobot.py) — re-measure them if you set one.
    tool_offset_mm: [0.0, 0.0, 600.0]
    # How far to press into the can. Declared but not yet applied.
    tool_head_compression_distance_mm: 50.0
    # trajectories_file is injected by robot.launch.py (share path);
    # set it here only to override.

task_manager:
  ros__parameters:
    # How long after /vision/scan to wait for the targets message.
    scan_timeout_sec: 30.0
    # --- calibration pose grid (sequencing side; math in localization_node) ---
    # SET SAFE, REACHABLE BOUNDS: every pose must keep the marker inside the
    # camera frame and the arm clear of the bin. [0,0] = not configured;
    # /task/calibrate refuses to run until these are set.
    calibration_x_range_mm: [-350.0,50.0]
    calibration_y_range_mm: [-1300.0,-900.0]
    # At least two heights >=30mm apart or the fit is rejected (Z unconstrained).
    # Must be floats (trailing .0) — a bare int here is an INTEGER_ARRAY and
    # the node refuses to start.
    calibration_z_levels_mm: [500.0, 550.0, 600.0] #add .0 MUST BE FLOATS
    calibration_grid_size: [3, 2]        # nx, ny poses per z level
    calibration_orientation_deg: [180.0, 0.0, 0.0]   # rx, ry, rz for every pose
    calibration_settle_sec: 0.5
    # Budget for one calibration_sample. Automatic (red-dot) mode needs only
    # seconds; manual centre select waits on a human, so this must stay above
    # localization_node.manual_click_timeout_sec.
    calibration_sample_timeout_sec: 180.0
    # --- auto extrinsic re-calibration at startup ---
    # With intrinsics known (camera SDK), a small grid corrects for camera
    # drift each boot. THE ARM MOVES AT LAUNCH — needs the x/y ranges above
    # set; disable if unattended motion at boot is unsafe for your cell.
    auto_calibrate_on_startup: true
    startup_calibration_grid_size: [2, 2]
    startup_calibration_z_levels_mm: [-200.0, 200.0]
    startup_calibration_wait_sec: 120.0

web_node:
  ros__parameters:
    port: 8000
    web_stream_hz: 15.0
    results_dir: "/ws/vision_workspace/operation/results"
    # params_file is injected by robot.launch.py so /api/config edits
    # persist to this file.
