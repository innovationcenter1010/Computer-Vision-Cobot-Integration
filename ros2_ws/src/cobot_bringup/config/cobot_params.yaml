camera_node:
  ros__parameters:
    color_endpoint: tcp://host.docker.internal:5550
    depth_endpoint: tcp://host.docker.internal:5551
    publish_rate_hz: 15.0
    publish_rate_warn_hz: 3.0
    publish_rate_error_hz: 1.0
    capture_dir: /ws/vision_workspace/operation/captures
    intrinsics_file: /ws/vision_workspace/operation/camera_intrinsics.json
detector_node:
  ros__parameters:
    models_yaml: /ws/runtime_models/models.yaml
    preload:
    - cans
    intra_op_threads: 0
    # -1 (default) = use each model's own confidence/max_detections from
    # models.yaml. Set >= 0 to override every model, tunable live with
    # `ros2 param set /detector_node min_confidence <0..1>` /
    # `... max_detections <n>` — takes effect on the next /vision/detect goal.
    min_confidence: -1.0
    max_detections: -1
localization_node:
  ros__parameters:
    pathing_row_axis: "y"
    pathing_row_tolerance_mm: 50.0
    can_height_mm: 87.0
    depth_buffer_size: 15
    depth_sample_window_px: 10
    verify_tolerance_mm: 40.0
    verify_max_depth_age_s: 2.0
    depth_at_top_layer_mm: 1900.0
    dot_samples_per_pose: 3
    calibration_min_samples: 6
    calibration_max_rms_mm: 5.0
    require_intrinsics: false
    manual_dot_selection: true
    manual_click_timeout_sec: 120.0
cobot_control:
  ros__parameters:
    robot_ip: 192.168.1.31
    poll_period_s: 0.1
    connect_retry_period_s: 1.0
    connect_timeout_ms: 500
    connect_retries: 3
    ymconnect_logging: false
    motion_timeout_s: 100.0
    pause_uses_hold: false
    check_reachability: true
    motion_poll_period_s: 0.05
    motion_start_grace_s: 3.0
    motion_feedback_hz: 5.0
    joint_limit_margin_deg: 5.0
    joint_limits_min_deg:
    - -210.0
    - -180.0
    - -67.0
    - -210.0
    - -180.0
    - -210.0
    joint_limits_max_deg:
    - 210.0
    - 180.0
    - 210.0
    - 210.0
    - 180.0
    - 210.0
    pendant_messages: true
    profile_source: controller
    profile_fixture_dir: ''
    profile_tool_file: TOOL.CND
    profile_uframe_file: UFRAME.CND
    profile_dump: true
    poll_joints: true
cobot_operation:
  ros__parameters:
    move_timeout_s: 120.0
    service_timeout_s: 5.0
    sensor_assert_timeout_s: 1.0
    sensor_assert_authoritative: false
    auto_convert_on_tool_change: true
task_manager:
  ros__parameters:
    default_workflow: pick_layer
    scan_timeout_sec: 30.0
    scan_model_id: ''
    vision_test_image_dir: /ws/vision_workspace/datasets
    vision_test_model_ids:
    - cans
    - green_light
    - green_light_v2
    vision_test_seed: 0
    vision_test_scan_timeout_sec: 90.0
    calibration_x_range_mm:
    - -350.0
    - 250.0
    calibration_y_range_mm:
    - -1300.0
    - -900.0
    calibration_z_levels_mm:
    - 450.0
    - 500.0
    - 550.0
    - 600.0
    calibration_grid_size:
    - 4
    - 4
    calibration_orientation_deg:
    - 180.0
    - 0.0
    - 0.0
    calibration_settle_sec: 1.0
    calibration_sample_timeout_sec: 180.0
    auto_calibrate_on_startup: false
    startup_calibration_grid_size:
    - 2
    - 2
    startup_calibration_z_levels_mm:
    - 500.0
    - 600.0
    startup_calibration_wait_sec: 120.0
    startup_calibration_workflow: startup_calibration
    calibrate_alias_workflow: calibration
    auto_calibration_model_id: green_light_v2
    auto_calibration_class_id: -1
    auto_calibration_samples_per_pose: 5
    auto_calibration_grid_size:
    - 4
    - 4
    auto_calibration_z_levels_mm:
    - 450.0
    - 500.0
    - 550.0
    - 600.0
    auto_startup_calibration_grid_size:
    - 3
    - 3
    auto_startup_calibration_z_levels_mm:
    - 500.0
    - 600.0
web_node:
  ros__parameters:
    port: 8000
    web_stream_hz: 15.0
    results_dir: /ws/vision_workspace/operation/results
    cobot_state_hz: 5.0
    calibration_model_ids:
    - red_dot
    - green_light
    - green_light_v2
    joint_limits_deg:
    - -180.0
    - 180.0
    - -180.0
    - 180.0
    - -180.0
    - 180.0
    - -180.0
    - 180.0
    - -180.0
    - 180.0
    - -180.0
    - 180.0
health_monitor:
  ros__parameters:
    expected_nodes:
    - camera_node
    - detector_node
    - localization_node
    - cobot_control
    - cobot_operation
    - task_manager
    - web_node
    - health_monitor
    stale_factor: 3.0
    summary_period_s: 1.0
