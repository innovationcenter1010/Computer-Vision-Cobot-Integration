services:
  cobot-ros:
    build:
      context: .
      dockerfile: docker/Dockerfile

    image: cobot-ros

    pull_policy: never
    restart: unless-stopped

    command: ["ros2", "launch", "cobot_bringup", "robot.launch.py"]

    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_DOMAIN_ID: "0"
      PYTHONUNBUFFERED: "1"
      YOLO_CONFIG_DIR: /tmp/Ultralytics

    ports:
      - "8000:8000"   # web UI only — ZMQ camera connects OUT to the host

    volumes:
      # Model weights + scan results (source of truth, never baked)
      - ./vision_workspace:/ws/vision_workspace
      # Saved camera frames (/camera/save_frames). Nested inside the mount
      # above — listed explicitly so the capture path is visible here and the
      # host directory is created before the first save.
      - ./vision_workspace/operation/captures:/ws/vision_workspace/operation/captures
      # Params editable without an image rebuild; /api/config writes here
      - ./ros2_ws/src/cobot_bringup/config:/ws/install/share/cobot_bringup/config

    stdin_open: true
    tty: true
