services:
  cobot-ai:
    build:
      context: .
      dockerfile: Dockerfile

    image: cobot-ai

    pull_policy: never
    restart: unless-stopped

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      YOLO_CONFIG_DIR: /tmp/Ultralytics

    ports:
      - "8000:8000"
    volumes:
      - ./vision_workspace:/app/vision_workspace

    privileged: true

    devices:
      - /dev/bus/usb:/dev/bus/usb
  

    command: ["python3", "-m", "cobot_application.main"]

    stdin_open: true
    tty: true